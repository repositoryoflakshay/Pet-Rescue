<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Post-Adoption Overview | PawsHeart</title>
  <style>
    body {
      font-family: "Segoe UI", sans-serif;
      background-color: #f0f4f8;
      margin: 0;
      padding: 0;
    }

    header {
      background: linear-gradient(120deg, #ff6e7f, #bfe9ff);
      color: white;
      padding: 1rem 2rem;
      text-align: center;
    }

    h2 {
      color: #264653;
      padding-top: 1rem;
      text-align: center;
    }

    .container {
      max-width: 800px;
      margin: 2rem auto;
      background: white;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    ul {
      list-style-type: none;
      padding: 0;
    }

    li {
      background: #f9f9f9;
      margin-bottom: 0.75rem;
      padding: 0.75rem;
      border-left: 5px solid #2a9d8f;
      border-radius: 4px;
    }

    footer {
      background-color: #264653;
      color: white;
      text-align: center;
      padding: 2rem;
      margin-top: 3rem;
    }
  </style>
</head>

<body>
  <header>
    <h1>🐾 PawsHeart Appointment Overview</h1>
  </header>

  <div class="container">
    <h2>📅 All Appointments</h2>

    <div style="margin-bottom: 1rem;">
      <input type="text" id="filterName" placeholder="Filter by Pet Name" />
      <button onclick="exportCSV()">Export CSV</button>
    </div>

    <table id="apptTable" border="1" style="width: 100%; border-collapse: collapse;">
      <thead>
        <tr>
          <th>Pet Name</th>
          <th>Date</th>
          <th>Time</th>
          <th>Note</th>
          <th>Phone</th>
          <th>Email</th>
          <th>Checklist</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>


  <footer>
    <p>Thank you for giving a pet a second chance 🐶</p>
  </footer>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const tableBody = document.querySelector("#apptTable tbody");
      let allAppointments = [];

      const fetchData = async () => {
        const res = await fetch("/api/appointments");
        allAppointments = await res.json();
        displayData(allAppointments);
      };

      const displayData = (data) => {
        tableBody.innerHTML = "";
        data.forEach(appt => {
          const row = document.createElement("tr");
          row.innerHTML = `
  <td>${appt.petName}</td>
  <td>${appt.date}</td>
  <td>${appt.time}</td>
  <td>${appt.note || "—"}</td>
  <td>${appt.phone}</td>
  <td>${appt.email}</td>
  <td>
    <ul style="margin: 0; padding-left: 1rem;">
      ${(appt.checklist || []).map(item => `<li>${item}</li>`).join("")}
    </ul>
  </td>
  <td>
    <button onclick="editAppt('${appt._id}')">Edit</button>
    <button onclick="deleteAppt('${appt._id}')">Delete</button>
  </td>`;

          tableBody.appendChild(row);
        });
      };

      document.getElementById("filterName").addEventListener("input", () => {
        const val = document.getElementById("filterName").value.toLowerCase();
        const filtered = allAppointments.filter(a => a.petName.toLowerCase().includes(val));
        displayData(filtered);
      });

      window.deleteAppt = async (id) => {
        if (!confirm("Delete this appointment?")) return;
        await fetch(`/appointments/${id}`, { method: "DELETE" });
        fetchData();
      };

      window.editAppt = (id) => {
        const appt = allAppointments.find(a => a._id === id);
        localStorage.setItem("editAppt", JSON.stringify(appt));
        location.href = `/edit-appointment.html?id=${id}`;
      };

      window.exportCSV = () => {
        let csv = "Pet Name,Date,Time,Note,Phone,Email,Checklist\n";
        allAppointments.forEach(a => {
          const checklist = (a.checklist || []).join(" | ");
          csv += `${a.petName},${a.date},${a.time},"${a.note}","${a.phone}","${a.email}","${checklist}"\n`;
        });
        const blob = new Blob([csv], { type: "text/csv" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "appointments.csv";
        a.click();
        URL.revokeObjectURL(url);
      };


      fetchData();
    });
  </script>

</body>

</html>
