<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PawsHeart Admin Dashboard</title>

    body {

      color: #2c3e50;

      background: #e74c3c;
      color: white;
      padding: 10px 20px;
      border: none;
      cursor: pointer;
      float: right;
    }
    #logoutBtn:hover {
      background: #c0392b;
    }
    #header {
      display: flex;
      justify-content: space-between;
      align-items: center;

  <div id="header">
    <h1 id="adminWelcome">Welcome, Admin</h1>
    <button id="logoutBtn" onclick="adminLogout()">Logout</button>

  <h2>Donation Records</h2>
  <table>
    <thead>
      <tr>

        <th>Email</th>
        <th>Amount</th>

        <th>Date</th>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const isAdmin = localStorage.getItem("isAdmin") === "true";
      const adminInfo = JSON.parse(localStorage.getItem("adminInfo") || "{}");

      // Protect admin page
      if (!isAdmin || !adminInfo.name) {
        alert("Access denied. Admin login required.");
        window.location.href = "home.html";
        return;
      }

      // Display welcome name
      const welcome = document.getElementById("adminWelcome");
      welcome.innerText = `Welcome, ${adminInfo.name}`;

      // Load donations
      loadDonations();
    });

    async function loadDonations() {
      try {
        const res = await fetch("http://localhost:3000/api/donations");
        const data = await res.json();

        const donationTable = document.getElementById("donationTableBody");
        donationTable.innerHTML = "";

        if (data.length === 0) {
          donationTable.innerHTML = "<tr><td colspan='5'>No donations found.</td></tr>";
          return;
        }

        data.forEach(donation => {
          const row = document.createElement("tr");
          row.innerHTML = `
            <td>${donation.name}</td>
            <td>${donation.email}</td>
            <td>₹${donation.amount}</td>
            <td>${donation.purpose}</td>
            <td>${new Date(donation.date).toLocaleDateString()}</td>
          `;
          donationTable.appendChild(row);
        });
      } catch (err) {
        console.error("Error fetching donations:", err);
        document.getElementById("donationTableBody").innerHTML =
          "<tr><td colspan='5'>Failed to load donations.</td></tr>";
      }
    }

    function adminLogout() {
      localStorage.removeItem("isAdmin");
      localStorage.removeItem("adminInfo");
      window.location.href = "home.html";
